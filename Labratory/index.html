<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ian Music Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card login-card shadow-lg">
            <header class="card-header text-white text-center">
                <div class="music-logo">♪</div>
                <h2>Ian Music Academy</h2>
                <p class="mb-0">Login to your dashboard</p>
            </header>

            <div class="card-body p-4">
                <div id="loginFeedback"></div>

                <form id="loginForm">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" class="form-control mb-3" required>

                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" class="form-control mb-3" required>

                    <div class="form-check mb-3">
                        <input id="rememberMe" type="checkbox" class="form-check-input">
                        <label for="rememberMe" class="form-check-label">Remember me</label>
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    Demo: <strong>admin</strong> / <strong>password123</strong>
                </p>
            </div>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
