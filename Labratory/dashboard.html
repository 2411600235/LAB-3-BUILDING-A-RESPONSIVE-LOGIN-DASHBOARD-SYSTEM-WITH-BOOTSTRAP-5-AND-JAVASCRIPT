<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Ian Music Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">♪ Ian Music Academy</span>
            <span class="text-white">
                Welcome, <b id="userName"></b>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm ms-3">Logout</button>
            </span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 sidebar p-3">
                <nav class="nav flex-column gap-2">
                    <a class="nav-link active" href="#">Dashboard</a>
                    <a class="nav-link" href="#statistics">My Progress</a>
                    <a class="nav-link" href="#activity">Practice Activity</a>
                    <a class="nav-link text-danger" href="#" id="logoutLink">Logout</a>
                </nav>
            </aside>

            <main class="col-md-9 col-lg-10 p-4">
                <h2 id="greeting"></h2>
                <p class="text-muted">Track your music learning progress.</p>

                <section id="statistics" class="row g-3 my-4">
                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card border-primary-custom">
                            <div class="card-body">
                                <h6>Practice Hours</h6>
                                <h2>24</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card border-success-custom">
                            <div class="card-body">
                                <h6>Completed Songs</h6>
                                <h2>32</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card border-info-custom">
                            <div class="card-body">
                                <h6>Active Lessons</h6>
                                <h2>8</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6 col-xl-3">
                        <div class="card stat-card border-warning-custom">
                            <div class="card-body">
                                <h6>Practice Streak</h6>
                                <h2>15 days</h2>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="activity" class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">Recent Practice Activity</h5>
                    </div>

                    <div class="card-body table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Activity</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="activityTableBody"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <footer class="text-center py-3">
        © 2026 Ian Kristofer L. Pantoja | Ian Music Academy
    </footer>

    <script src="js/dashboard.js"></script>
</body>
</html>
